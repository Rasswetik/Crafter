<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
.o{transform-box:fill-box;transform-origin:center}
.float{animation:fl 3.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.rays{transform-origin:128px 128px;animation:rt 40s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}
.sheen{animation:sn 4s ease-in-out infinite}
@keyframes sn{0%,50%{transform:translateX(-260px)}100%{transform:translateX(260px)}}
.halo{animation:ha 3s ease-in-out infinite}
@keyframes ha{0%,100%{opacity:.5}50%{opacity:.95}}
.tw{animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.f1{animation:f1 2.4s ease-in-out infinite}.f2{animation:f2 2.4s ease-in-out infinite}
@keyframes f1{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes f2{0%,100%{opacity:.55}50%{opacity:1}}
.gl{animation:gl 3s ease-in-out infinite}
@keyframes gl{0%,45%{transform:translateX(-150px)}100%{transform:translateX(150px)}}
</style><defs>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#14052e" flood-opacity=".55"/></filter>
<clipPath id="disc"><circle cx="128" cy="128" r="104"/></clipPath>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9f7"/><stop offset=".35" stop-color="#ff7ac0"/><stop offset=".7" stop-color="#9a45ff"/><stop offset="1" stop-color="#3fd7ff"/></linearGradient>
<radialGradient id="bg" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#9a58ff"/><stop offset=".55" stop-color="#4b1f9c"/><stop offset="1" stop-color="#220c47"/></radialGradient>
<linearGradient id="shn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffc83a"/><stop offset="1" stop-color="#f08a14"/></linearGradient>
<linearGradient id="d1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9fbff"/><stop offset="1" stop-color="#4fcfff"/></linearGradient><linearGradient id="d2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fe9ff"/><stop offset="1" stop-color="#3a7bff"/></linearGradient><linearGradient id="d3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2ec"/><stop offset="1" stop-color="#b24cff"/></linearGradient><linearGradient id="d4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b9bff"/><stop offset="1" stop-color="#6a2cc9"/></linearGradient><clipPath id="gem"><polygon points="66,112 98,82 158,82 190,112 128,196"/></clipPath></defs><circle class="halo" cx="128" cy="128" r="112" fill="#3fb6ff" filter="url(#blur)"/><circle cx="128" cy="128" r="118" fill="url(#rim)"/><circle cx="128" cy="128" r="109" fill="#1a0838"/><circle cx="128" cy="128" r="104" fill="url(#bg)"/><g clip-path="url(#disc)"><g class="rays"><polygon points="128,128 348.0,128.0 344.7,166.2" fill="#fff" opacity=".07"/><polygon points="128,128 318.5,238.0 296.5,269.4" fill="#fff" opacity=".07"/><polygon points="128,128 238.0,318.5 203.2,334.7" fill="#fff" opacity=".07"/><polygon points="128,128 128.0,348.0 89.8,344.7" fill="#fff" opacity=".07"/><polygon points="128,128 18.0,318.5 -13.4,296.5" fill="#fff" opacity=".07"/><polygon points="128,128 -62.5,238.0 -78.7,203.2" fill="#fff" opacity=".07"/><polygon points="128,128 -92.0,128.0 -88.7,89.8" fill="#fff" opacity=".07"/><polygon points="128,128 -62.5,18.0 -40.5,-13.4" fill="#fff" opacity=".07"/><polygon points="128,128 18.0,-62.5 52.8,-78.7" fill="#fff" opacity=".07"/><polygon points="128,128 128.0,-92.0 166.2,-88.7" fill="#fff" opacity=".07"/><polygon points="128,128 238.0,-62.5 269.4,-40.5" fill="#fff" opacity=".07"/><polygon points="128,128 318.5,18.0 334.7,52.8" fill="#fff" opacity=".07"/></g></g><g class="float"><g filter="url(#drop)"><polygon points="66,112 98,82 97,112" fill="url(#d2)" class="f1"/><polygon points="98,82 128,82 128,112 97,112" fill="url(#d1)" class="f2"/><polygon points="128,82 158,82 159,112 128,112" fill="url(#d1)" class="f1"/><polygon points="158,82 190,112 159,112" fill="url(#d2)" class="f2"/><polygon points="66,112 97,112 128,196" fill="url(#d4)" class="f2"/><polygon points="97,112 128,112 128,196" fill="url(#d2)" class="f1"/><polygon points="128,112 159,112 128,196" fill="url(#d3)" class="f2"/><polygon points="159,112 190,112 128,196" fill="url(#d4)" class="f1"/><g fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.800" stroke-linejoin="round"><polygon points="66,112 98,82 158,82 190,112 128,196"/><path d="M66 112 H190 M97 112 L98 82 M159 112 L158 82 M128 82 V112 M97 112 L128 196 M159 112 L128 196 M128 112 L128 196"/></g><g clip-path="url(#gem)"><g class="gl"><polygon points="100,70 120,70 90,200 70,200" fill="#fff" opacity=".7"/></g></g></g></g><g clip-path="url(#disc)"><ellipse cx="128" cy="52" rx="86" ry="46" fill="#fff" opacity=".13"/><g class="sheen"><polygon points="70,10 120,10 60,246 10,246" fill="url(#shn)"/></g></g><circle cx="128" cy="128" r="104" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/><polygon class="o tw" style="animation-delay:0.2s" points="34.0,61.0 36.0,68.0 43.0,70.0 36.0,72.0 34.0,79.0 32.0,72.0 25.0,70.0 32.0,68.0" fill="#fff"/><polygon class="o tw" style="animation-delay:1.1s" points="222.0,51.0 223.5,56.5 229.0,58.0 223.5,59.5 222.0,65.0 220.5,59.5 215.0,58.0 220.5,56.5" fill="#fff"/><polygon class="o tw" style="animation-delay:1.6s" points="226.0,170.0 227.3,174.7 232.0,176.0 227.3,177.3 226.0,182.0 224.7,177.3 220.0,176.0 224.7,174.7" fill="#fff"/></svg>