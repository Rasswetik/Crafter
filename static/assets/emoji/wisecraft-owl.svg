<path d="M86 108 h14 M142 108 h14" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
<g class="ch"><path d="M92 160 Q128 196 164 160" fill="none" stroke="#7a4a00" stroke-width="8" stroke-linecap="round"/>
<path d="M92 160 Q128 196 164 160" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 3.500"/>
<rect x="112" y="184" width="32" height="24" rx="8" fill="url(#gold)" stroke="#a86300" stroke-width="2"/>
<path d="M119 190 l4 12 l5 -8 l5 8 l4 -12" fill="none" stroke="#7a4a00" stroke-width="3.500" stroke-linejoin="round" stroke-linecap="round"/></g>
</g></g><g clip-path="url(#disc)"><ellipse cx="128" cy="52" rx="86" ry="46" fill="#fff" opacity=".13"/><g class="sheen"><polygon points="70,10 120,10 60,246 10,246" fill="url(#shn)"/></g></g><circle cx="128" cy="128" r="104" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/><polygon class="o tw" style="animation-delay:0.2s" points="34.0,61.0 36.0,68.0 43.0,70.0 36.0,72.0 34.0,79.0 32.0,72.0 25.0,70.0 32.0,68.0" fill="#fff"/><polygon class="o tw" style="animation-delay:1.1s" points="222.0,51.0 223.5,56.5 229.0,58.0 223.5,59.5 222.0,65.0 220.5,59.5 215.0,58.0 220.5,56.5" fill="#fff"/><polygon class="o tw" style="animation-delay:1.6s" points="226.0,170.0 227.3,174.7 232.0,176.0 227.3,177.3 226.0,182.0 224.7,177.3 220.0,176.0 224.7,174.7" fill="#fff"/></svg>