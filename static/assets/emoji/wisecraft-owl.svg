<g id="tuft"><path d="M84 92 C78 74 80 60 86 54 C100 58 110 68 116 82Z" fill="url(#ow)"/></g>
</defs><circle class="halo" cx="128" cy="128" r="112" fill="#ff7a5c" filter="url(#blur)"/><circle cx="128" cy="128" r="118" fill="url(#rim)"/><circle cx="128" cy="128" r="109" fill="#1a0838"/><circle cx="128" cy="128" r="104" fill="url(#bg)"/><g clip-path="url(#disc)"><g class="rays"><polygon points="128,128 348.0,128.0 344.7,166.2" fill="#fff" opacity=".07"/><polygon points="128,128 318.5,238.0 296.5,269.4" fill="#fff" opacity=".07"/><polygon points="128,128 238.0,318.5 203.2,334.7" fill="#fff" opacity=".07"/><polygon points="128,128 128.0,348.0 89.8,344.7" fill="#fff" opacity=".07"/><polygon points="128,128 18.0,318.5 -13.4,296.5" fill="#fff" opacity=".07"/><polygon points="128,128 -62.5,238.0 -78.7,203.2" fill="#fff" opacity=".07"/><polygon points="128,128 -92.0,128.0 -88.7,89.8" fill="#fff" opacity=".07"/><polygon points="128,128 -62.5,18.0 -40.5,-13.4" fill="#fff" opacity=".07"/><polygon points="128,128 18.0,-62.5 52.8,-78.7" fill="#fff" opacity=".07"/><polygon points="128,128 128.0,-92.0 166.2,-88.7" fill="#fff" opacity=".07"/><polygon points="128,128 238.0,-62.5 269.4,-40.5" fill="#fff" opacity=".07"/><polygon points="128,128 318.5,18.0 334.7,52.8" fill="#fff" opacity=".07"/></g></g><g class="float">
<g filter="url(#drop)">
<g class="wl"><use href="#wing"/></g>
<g class="wr"><use href="#wing" transform="translate(256 0) scale(-1 1)"/></g>
