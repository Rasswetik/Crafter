<ellipse cx="128" cy="114" rx="52" ry="30" fill="url(#of)"/>
<path d="M118 130 Q128 125 138 130 L131 147 Q128 151 125 147Z" fill="#ff6a3d"/>
<path d="M122 131 Q128 128.500 134 131" fill="none" stroke="#fff" stroke-width="2.500" opacity=".7" stroke-linecap="round"/>
<rect x="79" y="100" width="42" height="30" rx="14" fill="url(#ln)"/><rect x="135" y="100" width="42" height="30" rx="14" fill="url(#ln)"/>
<rect x="79" y="100" width="42" height="30" rx="14" fill="none" stroke="#1a0838" stroke-width="4"/><rect x="135" y="100" width="42" height="30" rx="14" fill="none" stroke="#1a0838" stroke-width="4"/>
