<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
.o{transform-box:fill-box;transform-origin:center}
.float{animation:fl 3.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.rays{transform-origin:128px 128px;animation:rt 40s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}
.sheen{animation:sn 4s ease-in-out infinite}
@keyframes sn{0%,50%{transform:translateX(-260px)}100%{transform:translateX(260px)}}
.halo{animation:ha 3s ease-in-out infinite}
@keyframes ha{0%,100%{opacity:.5}50%{opacity:.95}}
.tw{animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.b1{transform-origin:128px 150px;animation:b1 3.4s ease-in-out infinite}.b2{transform-origin:128px 150px;animation:b2 3.4s ease-in-out infinite}
@keyframes b1{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-24deg) translateY(-3px)}}
@keyframes b2{0%,100%{transform:rotate(20deg)}50%{transform:rotate(24deg) translateY(-3px)}}
.coin{animation:cf 3.4s ease-in-out infinite}
@keyframes cf{0%,100%{transform:scaleX(1)}30%{transform:scaleX(.18)}50%{transform:scaleX(-1)}70%{transform:scaleX(.18)}}
</style><defs>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#14052e" flood-opacity=".55"/></filter>
<clipPath id="disc"><circle cx="128" cy="128" r="104"/></clipPath>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9f7"/><stop offset=".35" stop-color="#ff7ac0"/><stop offset=".7" stop-color="#9a45ff"/><stop offset="1" stop-color="#3fd7ff"/></linearGradient>
<radialGradient id="bg" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#9a58ff"/><stop offset=".55" stop-color="#4b1f9c"/><stop offset="1" stop-color="#220c47"/></radialGradient>
<linearGradient id="shn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffc83a"/><stop offset="1" stop-color="#f08a14"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf3ad"/><stop offset="1" stop-color="#1fa05a"/></linearGradient><linearGradient id="gr2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9bf7bf"/><stop offset="1" stop-color="#2cb56c"/></linearGradient></defs><circle class="halo" cx="128" cy="128" r="112" fill="#3fe08a" filter="url(#blur)"/><circle cx="128" cy="128" r="118" fill="url(#rim)"/><circle cx="128" cy="128" r="109" fill="#1a0838"/><circle cx="128" cy="128" r="104" fill="url(#bg)"/><g clip-path="url(#disc)"><g class="rays"><polygon points="128,128 348.0,128.0 344.7,166.2" fill="#fff" opacity=".07"/><polygon points="128,128 318.5,238.0 296.5,269.4" fill="#fff" opacity=".07"/><polygon points="128,128 238.0,318.5 203.2,334.7" fill="#fff" opacity=".07"/><polygon points="128,128 128.0,348.0 89.8,344.7" fill="#fff" opacity=".07"/><polygon points="128,128 18.0,318.5 -13.4,296.5" fill="#fff" opacity=".07"/><polygon points="128,128 -62.5,238.0 -78.7,203.2" fill="#fff" opacity=".07"/><polygon points="128,128 -92.0,128.0 -88.7,89.8" fill="#fff" opacity=".07"/><polygon points="128,128 -62.5,18.0 -40.5,-13.4" fill="#fff" opacity=".07"/><polygon points="128,128 18.0,-62.5 52.8,-78.7" fill="#fff" opacity=".07"/><polygon points="128,128 128.0,-92.0 166.2,-88.7" fill="#fff" opacity=".07"/><polygon points="128,128 238.0,-62.5 269.4,-40.5" fill="#fff" opacity=".07"/><polygon points="128,128 318.5,18.0 334.7,52.8" fill="#fff" opacity=".07"/></g></g><g class="float"><g filter="url(#drop)"><g class="b1"><rect x="56" y="82" width="144" height="84" rx="12" fill="url(#gr)"/><rect x="66" y="92" width="124" height="64" rx="8" fill="none" stroke="#d6ffe5" stroke-width="2.500" opacity=".7"/><circle cx="128" cy="124" r="18" fill="#b6f9d0" opacity=".55"/></g><g class="b2"><rect x="56" y="82" width="144" height="84" rx="12" fill="url(#gr2)"/><rect x="66" y="92" width="124" height="64" rx="8" fill="none" stroke="#d6ffe5" stroke-width="2.500" opacit