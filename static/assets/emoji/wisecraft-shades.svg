<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
.o{transform-box:fill-box;transform-origin:center}
.float{animation:fl 3.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.rays{transform-origin:128px 128px;animation:rt 40s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}
.sheen{animation:sn 4s ease-in-out infinite}
@keyframes sn{0%,50%{transform:translateX(-260px)}100%{transform:translateX(260px)}}
.halo{animation:ha 3s ease-in-out infinite}
@keyframes ha{0%,100%{opacity:.5}50%{opacity:.95}}
.tw{animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.gl{animation:gl 3s ease-in-out infinite}
@keyframes gl{0%,45%{transform:translateX(-90px)}100%{transform:translateX(150px)}}
.tilt{transform-origin:128px 128px;animation:ti 4s ease-in-out infinite}
@keyframes ti{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
</style><defs>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#14052e" flood-opacity=".55"/></filter>
<clipPath id="disc"><circle cx="128" cy="128" r="104"/></clipPath>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9f7"/><stop offset=".35" stop-color="#ff7ac0"/><stop offset=".7" stop-color="#9a45ff"/><stop offset="1" stop-color="#3fd7ff"/></linearGradient>
<radialGradient id="bg" cx=".5" cy=".3" r=".85"><stop offset="0" stop-color="#9a58ff"/><stop offset=".55" stop-color="#4b1f9c"/><stop offset="1" stop-color="#220c47"/></radialGradient>
<linearGradient id="shn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffc83a"/><stop offset="1" stop-color="#f08a14"/></linearGradient>
<linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fe3ff"/><stop offset=".48" stop-color="#8a45ff"/><stop offset=".52" stop-color="#ff7ac0"/><stop offset="1" stop-color="#ffb347"/></linearGradient><linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a86"/><stop offset="1" stop-color="#150633"/></linearGradient><clipPath id="lensL"><path d="M54 98 H116 Q124 98 123 106 L118 138 Q114 156 96 156 H76 Q58 156 55 138Z"/></clipPath><clipPath id="lensR"><path d="M202 98 H140 Q132 98 133 106 L138 138 Q142 156 160 156 H180 Q198 156 201 138Z"/></clipPath></defs><circle class="halo" cx="128" cy="128" r="112" fill="#8a45ff" filter="url(#blur)"/><circle cx="128" cy="128" r="118" fill="url(#rim)"/><circle cx="128" cy="128" r="109" fill="#1a0838"/><circle cx="128" cy="128" r="104" fill="url(#bg)"/><g clip-path="url(#disc)"><g class="rays"><polygon points="128,128 348.0,128.0 344.7,166.2" fill="#fff" opacity=".07"/><polygon points="128,128 318.5,238.0 296.5,269.4" fill="#fff" opacity=".07"/><polygon points="128,128 238.0,318.5 203.2,334.7" fill="#fff" opacity=".07"/><polygon points="128,128 128.0,348.0 89.8,344.7" fill="#fff" opacity=".07"/><polygon points="128,128 18.0,318.5 -13.4,296.5" fill="#fff" opacity=".07"/><polygon points="128,128 -62.5,238.0 -78.7,203.2" fill="#fff" opacity=".07"/><polygon points="128,128 -92.0,128.0 -88.7,89.8" fill="#fff" opacity=".07"/><polygon points="128,128 -62.5,18.0 -40.5,-13.4" fill="#fff" opacity=".07"/><polygon points="128,128 18.0,-62.5 52.8,-78.7" fill="#fff" opacity=".07"/><polygon points="128,128 128.0,-92.0 166.2,-88.7" fill="#fff" opacity=".07"/><polygon points="128,128 238.0,-62.5 269.4,-40.5" fill="#fff" opacity=".07"/><polygon points="128,128 318.5,18.0 334.7,52.8" fill="#fff" opacity=".07"/></g></g><g class="float"><g filter="url(#drop)"><g class="tilt"><path d="M36 104 L54 100 M220 104 L202 100" stroke="url(#fr)" stroke-width="8" stroke-linecap="round"/><path d="M54 98 H11