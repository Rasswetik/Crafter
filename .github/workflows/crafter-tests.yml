name: Crafter regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate Python modules
        run: python -m compileall -q app.py wallet.py auto_payout.py auto_payout_worker.py offers.py resale.py staking.py telegram_deposits.py gift_withdrawals.py banners.py
      - name: Flask regression tests
        run: python -m pytest tests -q
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in static/*.js; do node --check "$file"; done
      - name: Craft renderer checks
        run: |
          node tests/test_cube.cjs
          node tests/test_event_banner_width.cjs
          node tests/test_timer_formats.cjs
          node tests/test_leaderboard_designer.cjs
          node tests/test_arena_winner_landing.cjs
          node tests/test_wallet_amount_center.cjs
          node tests/test_auto_payout_admin_assets.cjs
      - name: Gift dialog, share links and offer UI checks
        run: node tests/test_gift_share.cjs
