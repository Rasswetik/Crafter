name: Crafter keep-alive and health monitor

on:
  schedule:
    # Free Render services idle out after 15 minutes.
    # GitHub cron is best effort and can occasionally run late.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crafter-health
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request health endpoint and validate reply
        shell: bash
        env:
          CRAFTER_HEALTH_URL: https://crafter-v3sb.onrender.com/health
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if curl --fail --silent --show-error \
                --connect-timeout 20 --max-time 120 \
                -H 'Cache-Control: no-cache' \
                "$CRAFTER_HEALTH_URL" -o health.json; then
              if python3 -c 'import json; assert json.load(open("health.json"))["ok"] is True'; then
                echo "Crafter responded and database health check passed"
                exit 0
              fi
            fi
            echo "Health check attempt $attempt failed"
            sleep 10
          done
          echo "::error::Crafter health endpoint did not respond correctly"
          exit 1
