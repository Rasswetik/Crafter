<template id="collection-screen">
    <section class="collection-page">
        <button type="button" class="collection-back" onclick="closeCollectionPage()">‹ Маркет</button>
        <div class="collection-banner">
            <div class="collection-banner-art" aria-hidden="true"></div>
            <div class="collection-heading">
                <img class="collection-thumbnail" alt="">
                <h1></h1>
            </div>
        </div>
        <dl class="collection-metrics">
            <div><dt>Объём 24 ч</dt><dd data-volume="24h">—</dd></div>
            <div><dt>Общий объём</dt><dd data-volume="total">—</dd></div>
            <div><dt>Мин. цена</dt><dd data-collection-floor>—</dd></div>
        </dl>
    </section>
</template>
